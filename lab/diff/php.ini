[Session]
session.save_handler = files
session.save_path = /tmp/sessions
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 0
session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.prefix = upload_progress_
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 0

[PHP]
display_errors = On
error_reporting = E_ALL
file_uploads = On
post_max_size = 128M
upload_max_filesize = 128M

[opcache]
; Preload makes the gadget class visible BEFORE RINIT — the exact window the
; rfc1867 upload-progress early session decode runs in. Required for the
; CVE-2026-109618 early-decode differential (8.2.34 fires __destruct,
; 8.2.35+ degrades the object to __PHP_Incomplete_Class).
; NB: opcache.preload_user is MANDATORY — without it php-fpm fatals on start.
opcache.enable = 1
opcache.preload = /var/www/html/preload.php
opcache.preload_user = root
